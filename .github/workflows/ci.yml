name: MLflow CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  MLFLOW_TRACKING_URI: "file:./mlruns"

jobs:
  mlflow-pipeline:
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # STEP 1: Checkout repository (BASIC)
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # STEP 2: Setup Python (BASIC)
      # ==========================================================
      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ==========================================================
      # STEP 3: Check environment (BASIC)
      # ==========================================================
      - name: Check environment
        run: |
          python --version
          pip --version
          which python

      # ==========================================================
      # STEP 4: Install dependencies (BASIC)
      # ==========================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      # ==========================================================
      # STEP 5: Run MLflow Project (BASIC)
      # ==========================================================
      - name: Run MLflow Project
        working-directory: ./MLProject
        run: |
          mlflow run . --env-manager local

      # ==========================================================
      # STEP 6: Upload MLflow Artifacts (SKILLED)
      # ==========================================================
      - name: Upload MLflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            MLProject/mlruns/
            MLProject/dataset_preprocessing/
          if-no-files-found: warn

      # ==========================================================
      # STEP 7: Build Docker Image (ADVANCE)
      # ==========================================================
      - name: Build Docker Image
        run: |
          docker build -t wine-classification:latest ./MLProject
          echo "Docker image built: wine-classification:latest"

      # ==========================================================
      # STEP 8: Login Docker Hub (ADVANCE)
      # ==========================================================
      - name: Login Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ==========================================================
      # STEP 9: Tag Docker Image (ADVANCE)
      # ==========================================================
      - name: Tag Docker Image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/wine-classification"
          docker tag wine-classification:latest $IMAGE:latest
          docker tag wine-classification:latest $IMAGE:${{ github.sha }}
          echo "Docker image tagged: $IMAGE:latest"
          echo "Docker image tagged: $IMAGE:${{ github.sha }}"

      # ==========================================================
      # STEP 10: Push Docker Image (ADVANCE)
      # ==========================================================
      - name: Push Docker Image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/wine-classification"
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          echo "Docker image pushed to Docker Hub"

      # ==========================================================
      # STEP 11: Complete Job (ADVANCE)
      # ==========================================================
      - name: Complete Job
        if: always()
        run: |
          echo "=============================================="
          echo "  MLflow CI/CD Pipeline Completed Successfully"
          echo "=============================================="
          echo "  Basic  : MLflow Project executed"
          echo "  Skilled: Artifacts uploaded to GitHub"
          echo "  Advance: Docker image pushed to Docker Hub"
          echo "=============================================="
